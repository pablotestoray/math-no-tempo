<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#2A1C10">
<title>Mathematica: protótipo 3D, Tales em Gizé</title>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;700&family=EB+Garamond:ital,wght@0,400;0,500;0,700;1,400&display=swap" rel="stylesheet">
<style>
:root{--papiro:#E9D8AE;--papiro3:#D4B271;--tinta:#2A1C10;--tinta2:#4A3420;--verm:#9E3B26;--sombra:#6B4A26;--perg:#EFE3C4;--mar:#5E7F99}
*{box-sizing:border-box}
html,body{margin:0;height:100%;overflow:hidden;background:var(--papiro);touch-action:none;-webkit-user-select:none;user-select:none;font-family:"EB Garamond",Georgia,serif;color:var(--tinta)}
canvas{position:fixed;inset:0;width:100vw;height:100vh;display:block}
.ui{position:fixed;pointer-events:none}
.pilula{pointer-events:auto;background:rgba(233,216,174,.9);border:1.5px solid var(--tinta);border-radius:24px}
/* canto de cima à esquerda: voltar e o sol */
.canto{top:max(8px,env(safe-area-inset-top,0px));left:max(8px,env(safe-area-inset-left,0px));display:flex;align-items:center;gap:8px}
.btn-ico{pointer-events:auto;width:42px;height:42px;border-radius:50%;border:1.5px solid var(--tinta);background:rgba(233,216,174,.9);color:var(--tinta);display:flex;align-items:center;justify-content:center;text-decoration:none;font-size:26px;line-height:1;padding-bottom:3px}
.sol{display:flex;align-items:center;gap:6px;padding:2px 12px 2px 4px;height:46px}
.sol svg{width:42px;height:42px;flex:none}
.sol input{width:118px;accent-color:var(--verm);margin:0;height:28px}
.sol b{font-family:"Cinzel",Georgia,serif;font-weight:700;color:var(--verm);font-size:14px;min-width:3.2em;text-align:right}
/* canto de cima à direita: altura do olhar */
.olhar{top:max(8px,env(safe-area-inset-top,0px));right:max(8px,env(safe-area-inset-right,0px))}
button{pointer-events:auto;height:42px;padding:0 14px;border:1.5px solid var(--tinta);border-radius:22px;background:rgba(233,216,174,.9);color:var(--tinta);font-family:"Cinzel",Georgia,serif;font-size:13px;letter-spacing:.03em;white-space:nowrap;display:inline-flex;align-items:center;gap:6px}
button svg{width:16px;height:16px;flex:none}
/* embaixo, no meio: a ação */
.acao{bottom:max(14px,env(safe-area-inset-bottom,0px));left:50%;transform:translateX(-50%)}
.acao button{height:48px;padding:0 22px;font-size:14px;background:var(--tinta);color:var(--papiro);border-color:var(--tinta)}
.dica{left:0;right:0;top:60%;text-align:center;font-style:italic;font-size:15px;color:var(--tinta);text-shadow:0 0 6px var(--papiro),0 0 2px var(--papiro),0 0 2px var(--papiro);transition:opacity 1.2s}
.dica.sumiu{opacity:0}
</style>
</head>
<body>
<canvas id="c"></canvas>

<div class="ui canto">
  <a class="btn-ico" id="b-volta" href="index.html#estudos" aria-label="Voltar aos estudos">&lsaquo;</a>
  <div class="pilula sol">
    <svg viewBox="0 0 60 60" aria-hidden="true">
      <circle cx="30" cy="31" r="22" fill="none" stroke="#2A1C10" stroke-width="1.2" stroke-dasharray="2 3" opacity=".7"/>
      <path d="M44 11 A22 22 0 0 1 51 22" fill="none" stroke="#9E3B26" stroke-width="1.6"/>
      <path d="M48.5 21 L51.6 23.4 L52.6 19.6" fill="none" stroke="#9E3B26" stroke-width="1.6" stroke-linejoin="round"/>
      <circle cx="30" cy="31" r="9" fill="#5E7F99" stroke="#2A1C10" stroke-width="1.4"/>
      <path d="M24 28 q3 -4 7 -2 q2 3 6 1" fill="none" stroke="#D4B271" stroke-width="2.2" stroke-linecap="round"/>
      <line x1="30" y1="22" x2="30" y2="17" stroke="#2A1C10" stroke-width="1.6" stroke-linecap="round"/>
      <g id="sol-ico"><circle r="5" fill="#9E3B26"/><g stroke="#9E3B26" stroke-width="1.3" stroke-linecap="round"><line x1="0" y1="-7.5" x2="0" y2="-9.5"/><line x1="0" y1="7.5" x2="0" y2="9.5"/><line x1="-7.5" y1="0" x2="-9.5" y2="0"/><line x1="7.5" y1="0" x2="9.5" y2="0"/></g></g>
    </svg>
    <input id="r-hora" type="range" min="0" max="240" step="30" value="30" aria-label="Hora do dia: mexe o sol">
    <b id="t-hora">13:30</b>
  </div>
</div>

<div class="ui olhar">
  <button type="button" id="b-olhar" aria-label="Alternar altura do olhar">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M2 12 C5 6 19 6 22 12 C19 18 5 18 2 12 Z"/><circle cx="12" cy="12" r="3"/></svg><span id="t-olhar">Olhar de cima</span>
  </button>
</div>

<div class="ui acao">
  <button type="button" id="b-acao">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><line x1="12" y1="3" x2="12" y2="20"/><line x1="7" y1="20" x2="17" y2="20"/></svg><span id="t-acao">Pegar estaca</span>
  </button>
</div>

<div class="ui dica" id="dica">Arraste à esquerda para andar · à direita para olhar</div>

<script>
(function(){
'use strict';
const cv=document.getElementById('c'), ctx=cv.getContext('2d');
let W=0,H=0,DPR=1,FP=1,K=1;
function resize(){ DPR=Math.min(2,window.devicePixelRatio||1); W=innerWidth; H=innerHeight; cv.width=Math.round(W*DPR); cv.height=Math.round(H*DPR); ctx.setTransform(DPR,0,0,DPR,0,0); FP=(H/2)/Math.tan(34*Math.PI/180); K=Math.min(W,H)/390; }
addEventListener('resize',resize); resize();

/* ---------- mundo (1 unidade = 1 passo = 1 metro) ---------- */
const ALT=146, HB=115, NEAR=0.25, EST_H=2, EYE=1.7, ALCANCE=30;
const rad=d=>d*Math.PI/180, clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
const dot=(a,b)=>a[0]*b[0]+a[1]*b[1]+a[2]*b[2];
const cross=(a,b)=>[a[1]*b[2]-a[2]*b[1],a[2]*b[0]-a[0]*b[2],a[0]*b[1]-a[1]*b[0]];
const norm=a=>{ const l=Math.hypot(a[0],a[1],a[2])||1; return [a[0]/l,a[1]/l,a[2]/l]; };
const add=(a,b)=>[a[0]+b[0],a[1]+b[1],a[2]+b[2]], sub=(a,b)=>[a[0]-b[0],a[1]-b[1],a[2]-b[2]], mul=(a,k)=>[a[0]*k,a[1]*k,a[2]*k];
const n2=v=>v.toFixed(2).replace('.',',');

// mesma conta do capítulo 1: 73,92 × sen(π × (hora − 6) / 12)
function elev(v){ const h=13+v/60; return rad(73.92*Math.sin(Math.PI*(h-6)/12)); }
function sunDir(v){ const e=elev(v); return [0,Math.sin(e),-Math.cos(e)]; } // do chão até o sol; sul = −z, norte = +z
function horaTxt(v){ const m=780+v; return String(Math.floor(m/60)).padStart(2,'0')+':'+String(m%60).padStart(2,'0'); }

// começa a leste da pirâmide, olhando para o oeste: a sombra aparece de perfil
const st={ x:190, z:40, yaw:-Math.PI/2, pitch:-0.32, eye:EYE, v:30, stick:null, hold:false, anim:null, jx:0, jy:0, keys:{}, andando:0 };

/* ---------- câmera e projeção ---------- */
let CAM=null;
function makeCam(){
  const cy=Math.cos(st.yaw), sy=Math.sin(st.yaw), cp=Math.cos(st.pitch), sp=Math.sin(st.pitch);
  const F=[sy*cp,sp,cy*cp], R=[cy,0,-sy], U=cross(F,R);
  return {F,R,U,E:[st.x,st.eye,st.z]};
}
function toView(p){ const d=sub(p,CAM.E); return [dot(d,CAM.R),dot(d,CAM.U),dot(d,CAM.F)]; }
function scr(v){ return [W/2+FP*v[0]/v[2], H/2-FP*v[1]/v[2]]; }
function clipPoly(vs){
  const out=[];
  for(let i=0;i<vs.length;i++){
    const a=vs[i], b=vs[(i+1)%vs.length], ai=a[2]>=NEAR, bi=b[2]>=NEAR;
    if(ai) out.push(a);
    if(ai!==bi){ const t=(NEAR-a[2])/(b[2]-a[2]); out.push([a[0]+(b[0]-a[0])*t,a[1]+(b[1]-a[1])*t,NEAR]); }
  }
  return out;
}
function poly3(pts,fill,stroke,lw){
  const vs=clipPoly(pts.map(toView)); if(vs.length<3) return;
  ctx.beginPath(); vs.forEach((v,i)=>{ const s=scr(v); i?ctx.lineTo(s[0],s[1]):ctx.moveTo(s[0],s[1]); }); ctx.closePath();
  if(fill){ ctx.fillStyle=fill; ctx.fill(); }
  if(stroke){ ctx.strokeStyle=stroke; ctx.lineWidth=lw||1; ctx.stroke(); }
}
function seg3(a,b,color,lw){
  let A=toView(a), B=toView(b);
  if(A[2]<NEAR&&B[2]<NEAR) return;
  if(A[2]<NEAR){ const t=(NEAR-A[2])/(B[2]-A[2]); A=[A[0]+(B[0]-A[0])*t,A[1]+(B[1]-A[1])*t,NEAR]; }
  if(B[2]<NEAR){ const t=(NEAR-B[2])/(A[2]-B[2]); B=[B[0]+(A[0]-B[0])*t,B[1]+(A[1]-B[1])*t,NEAR]; }
  const p=scr(A), q=scr(B);
  ctx.beginPath(); ctx.moveTo(p[0],p[1]); ctx.lineTo(q[0],q[1]); ctx.strokeStyle=color; ctx.lineWidth=lw; ctx.lineCap='round'; ctx.stroke();
}
function hull(pts){ // casco convexo no plano do chão (x, z)
  const p=pts.map(q=>[q[0],q[2]]).sort((a,b)=>a[0]-b[0]||a[1]-b[1]);
  const cr=(o,a,b)=>(a[0]-o[0])*(b[1]-o[1])-(a[1]-o[1])*(b[0]-o[0]);
  const lo=[], up=[];
  for(const q of p){ while(lo.length>1&&cr(lo[lo.length-2],lo[lo.length-1],q)<=0) lo.pop(); lo.push(q); }
  for(let i=p.length-1;i>=0;i--){ const q=p[i]; while(up.length>1&&cr(up[up.length-2],up[up.length-1],q)<=0) up.pop(); up.push(q); }
  up.pop(); lo.pop(); return lo.concat(up).map(q=>[q[0],0,q[1]]);
}
function shadowOnGround(p,S){ const k=p[1]/S[1]; return [p[0]-S[0]*k,0,p[2]-S[2]*k]; }

/* ---------- pirâmide ---------- */
const PA=[[-HB,0,-HB],[HB,0,-HB],[HB,0,HB],[-HB,0,HB]], PT=[0,ALT,0];
const FACES=[[PA[0],PA[1],PT],[PA[1],PA[2],PT],[PA[2],PA[3],PT],[PA[3],PA[0],PT]].map(f=>{
  const c=mul(add(add(f[0],f[1]),f[2]),1/3);
  let n=norm(cross(sub(f[1],f[0]),sub(f[2],f[0])));
  if(dot(n,sub(c,[0,ALT*0.3,0]))<0) n=mul(n,-1);
  return {f,c,n,d:dot(n,f[0])};
});
const PLANOS=FACES.map(q=>({n:q.n,d:q.d})).concat([{n:[0,-1,0],d:0}]);
// a linha de A até B passa por dentro da pirâmide? (serve para saber o que está na frente)
function atrasDaPiramide(A,B){
  let t0=0, t1=1; const D=sub(B,A);
  for(const p of PLANOS){
    const a=dot(p.n,A)-p.d, b=dot(p.n,D);
    if(Math.abs(b)<1e-9){ if(a>0) return false; continue; }
    const t=-a/b;
    if(b<0) t0=Math.max(t0,t); else t1=Math.min(t1,t);
    if(t0>t1) return false;
  }
  return t1-t0>1e-3;
}
const C_LUZ=[0xD4,0xB2,0x71], C_SOMB=[0x6B,0x4A,0x26];
function mixCor(t){ return 'rgb('+C_SOMB.map((c,i)=>Math.round(c+(C_LUZ[i]-c)*t)).join(',')+')'; }

/* ---------- onde a mira aponta no chão ---------- */
function alvo(){
  const F=CAM.F, E=CAM.E;
  if(F[1]>-0.02) return {ok:false,motivo:'olhe para o chão'};
  const t=-E[1]/F[1], p=add(E,mul(F,t)); p[1]=0;
  if(Math.hypot(p[0]-st.x,p[2]-st.z)>ALCANCE) return {ok:false,motivo:'chegue mais perto',p};
  if(Math.abs(p[0])<HB+1&&Math.abs(p[2])<HB+1) return {ok:false,motivo:'aqui é a pirâmide',p};
  return {ok:true,p};
}

/* ---------- textos na cena ---------- */
function rotulo(p,txt,cor,tam,dy){
  const v=toView(p); if(v[2]<NEAR) return;
  if(atrasDaPiramide(CAM.E,p)) return;
  const s=scr(v); s[1]+=dy||0;
  ctx.font='700 '+(tam||16)+'px "EB Garamond",Georgia,serif'; ctx.textAlign='center'; ctx.textBaseline='middle';
  ctx.lineWidth=4; ctx.strokeStyle='rgba(239,227,196,.95)'; ctx.lineJoin='round'; ctx.strokeText(txt,s[0],s[1]);
  ctx.fillStyle=cor||'#2A1C10'; ctx.fillText(txt,s[0],s[1]);
  ctx.textAlign='start'; ctx.textBaseline='alphabetic';
}

/* ---------- desenho ---------- */
function desenhaEstaca(b,alfa){
  const t=[b[0],EST_H,b[2]];
  ctx.globalAlpha=alfa; seg3(b,t,'#2A1C10',6); seg3(add(b,[0,0.05,0]),add(t,[0,-0.05,0]),'#8A5E2E',3.5); ctx.globalAlpha=1;
}
function draw(t){
  const S=sunDir(st.v), e=elev(st.v), tg=Math.tan(e);
  CAM=makeCam();
  const g=ctx.createLinearGradient(0,0,0,H); g.addColorStop(0,'#D9C48F'); g.addColorStop(0.6,'#EFE3C4'); g.addColorStop(1,'#E2CC98');
  ctx.fillStyle=g; ctx.fillRect(0,0,W,H);
  // sol
  { const sp=add(CAM.E,mul(S,900)), v=toView(sp); if(v[2]>NEAR){ const p=scr(v); const gl=ctx.createRadialGradient(p[0],p[1],6,p[0],p[1],90); gl.addColorStop(0,'rgba(158,59,38,.35)'); gl.addColorStop(1,'rgba(158,59,38,0)'); ctx.fillStyle=gl; ctx.fillRect(p[0]-90,p[1]-90,180,180); ctx.beginPath(); ctx.arc(p[0],p[1],16,0,Math.PI*2); ctx.fillStyle='#9E3B26'; ctx.fill(); } }
  // chão
  poly3([[-900,0,-900],[900,0,-900],[900,0,900],[-900,0,900]],'#E2CC98');
  for(let i=-400;i<=400;i+=20){ seg3([i,0,-400],[i,0,400],'rgba(42,28,16,.16)',1); seg3([-400,0,i],[400,0,i],'rgba(42,28,16,.16)',1); }
  // sombras no chão
  poly3(hull([...PA,shadowOnGround(PT,S)]),'rgba(42,28,16,.38)');
  let sombEst=null;
  if(st.stick){ const b=[st.stick.x,0,st.stick.z]; sombEst=shadowOnGround([st.stick.x,EST_H,st.stick.z],S); seg3(b,sombEst,'rgba(42,28,16,.6)',5); }
  // marca onde a estaca vai ficar
  const mira=st.hold&&!st.anim?alvo():null;
  if(mira&&mira.ok){
    const c=mira.p, pts=[]; for(let i=0;i<20;i++){ const a=i/20*Math.PI*2; pts.push([c[0]+Math.cos(a)*0.6,0,c[2]+Math.sin(a)*0.6]); }
    poly3(pts,'rgba(158,59,38,.25)','#9E3B26',2);
    desenhaEstaca(c,0.35);
  }
  // estaca e pirâmide: o que está mais longe vai primeiro
  const estacaAtras=st.stick&&atrasDaPiramide(CAM.E,[st.stick.x,1,st.stick.z]);
  if(st.stick&&estacaAtras) desenhaEstaca([st.stick.x,0,st.stick.z],1);
  const fs=[];
  for(const q of FACES){
    if(dot(q.n,sub(CAM.E,q.c))<=0) continue;
    fs.push({f:q.f,dist:Math.hypot(...sub(CAM.E,q.c)),cor:mixCor(0.2+0.8*Math.max(0,dot(q.n,S)))});
  }
  fs.sort((a,b)=>b.dist-a.dist);
  for(const q of fs) poly3(q.f,q.cor,'#2A1C10',1.2);
  if(st.stick&&!estacaAtras) desenhaEstaca([st.stick.x,0,st.stick.z],1);
  // números em cima das coisas
  if(st.stick&&Math.hypot(st.stick.x-st.x,st.stick.z-st.z,st.eye)<60){
    rotulo([st.stick.x,EST_H+0.45,st.stick.z],'2 passos','#2A1C10',16);
    const meio=mul(add([st.stick.x,0,st.stick.z],sombEst),0.5);
    rotulo(meio,'sombra '+n2(EST_H/tg),'#9E3B26',16,20);
  }
  const vis=ALT/tg-HB;
  if(vis>0.5) rotulo([0,0,HB+vis/2],'sombra '+Math.round(vis),'#9E3B26',18,20);
  // joystick
  if(joy.on){ ctx.beginPath(); ctx.arc(joy.cx,joy.cy,56,0,Math.PI*2); ctx.strokeStyle='rgba(42,28,16,.5)'; ctx.lineWidth=2; ctx.stroke(); ctx.beginPath(); ctx.arc(joy.cx+st.jx*56,joy.cy+st.jy*-56,22,0,Math.PI*2); ctx.fillStyle='rgba(158,59,38,.6)'; ctx.fill(); }
  // mira no meio da tela
  desenhaMira(mira);
  // a mão
  desenhaMao(t);
}
function desenhaMira(m){
  const x=W/2, y=H/2, r=9;
  const cor=m?(m.ok?'#9E3B26':'rgba(42,28,16,.45)'):'rgba(42,28,16,.55)';
  ctx.strokeStyle='rgba(239,227,196,.9)'; ctx.lineWidth=4; ctx.lineCap='round';
  ctx.beginPath(); ctx.moveTo(x-r,y); ctx.lineTo(x+r,y); ctx.moveTo(x,y-r); ctx.lineTo(x,y+r); ctx.stroke();
  ctx.strokeStyle=cor; ctx.lineWidth=2;
  ctx.beginPath(); ctx.moveTo(x-r,y); ctx.lineTo(x+r,y); ctx.moveTo(x,y-r); ctx.lineTo(x,y+r); ctx.stroke();
  if(m&&!m.ok){
    ctx.font='italic 14px "EB Garamond",Georgia,serif'; ctx.textAlign='center';
    ctx.lineWidth=4; ctx.strokeStyle='rgba(239,227,196,.95)'; ctx.strokeText(m.motivo,x,y+28); ctx.fillStyle='#2A1C10'; ctx.fillText(m.motivo,x,y+28); ctx.textAlign='start';
  }
}
// mão em silhueta, como nos vasos gregos, segurando a estaca
function desenhaMao(t){
  let p=0, tipo=null;
  if(st.anim){ p=clamp((t-st.anim.t0)/st.anim.dur,0,1); tipo=st.anim.tipo; }
  const segura=st.hold||(tipo==='colocar'&&p<0.5);
  if(!segura&&!tipo) return;
  const bob=Math.sin(t/110)*4*K*st.andando;
  let bx=W-118*K, by=H-74*K+bob, ang=-0.18, esc=1;
  if(tipo==='colocar'){ const s=Math.sin(p*Math.PI); bx-=(W*0.22)*s; by+=40*K*s; ang-=0.5*s; esc=1-0.25*s; }
  if(tipo==='pegar'){ by+=(1-p)*220*K; }
  ctx.save(); ctx.translate(bx,by); ctx.rotate(ang); ctx.scale(esc*K,esc*K);
  // braço
  ctx.fillStyle='#2A1C10';
  ctx.beginPath(); ctx.moveTo(-26,12); ctx.lineTo(26,10); ctx.lineTo(120,180); ctx.lineTo(30,200); ctx.closePath(); ctx.fill();
  // estaca (atrás dos dedos)
  if(segura){
    ctx.lineCap='round';
    ctx.strokeStyle='#2A1C10'; ctx.lineWidth=15; ctx.beginPath(); ctx.moveTo(-6,60); ctx.lineTo(-30,-170); ctx.stroke();
    ctx.strokeStyle='#8A5E2E'; ctx.lineWidth=9; ctx.beginPath(); ctx.moveTo(-6,58); ctx.lineTo(-30,-168); ctx.stroke();
    ctx.strokeStyle='rgba(239,227,196,.35)'; ctx.lineWidth=2.5; ctx.beginPath(); ctx.moveTo(-9,50); ctx.lineTo(-32,-160); ctx.stroke();
  }
  // punho e dedos
  ctx.fillStyle='#2A1C10';
  ctx.beginPath(); ctx.ellipse(0,4,30,24,-0.2,0,Math.PI*2); ctx.fill();
  for(let i=0;i<4;i++){ ctx.beginPath(); ctx.ellipse(-24+i*2,-14+i*11,10,7,0.2,0,Math.PI*2); ctx.fill(); }
  ctx.strokeStyle='rgba(212,178,113,.55)'; ctx.lineWidth=1.6;
  for(let i=1;i<4;i++){ ctx.beginPath(); ctx.moveTo(-30+i*2,-19+i*11); ctx.lineTo(-12+i*2,-17+i*11); ctx.stroke(); }
  ctx.restore();
}

/* ---------- textos do HUD ---------- */
function hud(){
  document.getElementById('t-hora').textContent=horaTxt(st.v);
  document.getElementById('t-acao').textContent=st.hold?'Colocar estaca':(st.stick?'Pegar a estaca de volta':'Pegar estaca');
  document.getElementById('t-olhar').textContent=st.eye>EYE?'Olhar de gente':'Olhar de cima';
  // o sol do desenho dá a volta na Terra conforme a hora (meio-dia em cima)
  const h=13+st.v/60, a=rad((h-12)*15), x=30+22*Math.sin(a), y=31-22*Math.cos(a);
  document.getElementById('sol-ico').setAttribute('transform','translate('+x.toFixed(1)+' '+y.toFixed(1)+')');
}

/* ---------- pegar e colocar ---------- */
function acao(){
  if(st.anim) return;
  const t=performance.now();
  if(st.hold){
    const m=alvo(); if(!m.ok) return;
    st.anim={tipo:'colocar',t0:t,dur:520,p:m.p,pos:false};
  } else {
    st.stick=null; st.hold=true; st.anim={tipo:'pegar',t0:t,dur:320};
  }
}
function andaAnim(t){
  const a=st.anim; if(!a) return;
  const p=(t-a.t0)/a.dur;
  if(a.tipo==='colocar'&&p>=0.5&&!a.pos){ a.pos=true; st.hold=false; st.stick={x:a.p[0],z:a.p[2]}; }
  if(p>=1) st.anim=null;
}

/* ---------- movimento ---------- */
function update(dt){
  const k=st.keys;
  let f=(k.w||k.ArrowUp?1:0)-(k.s||k.ArrowDown?1:0)+st.jy;
  let s=(k.d?1:0)-(k.a?1:0)+st.jx;
  const yawKey=(k.ArrowRight||k.e?1:0)-(k.ArrowLeft||k.q?1:0);
  if(yawKey) st.yaw+=yawKey*dt*1.6;
  f=clamp(f,-1,1); s=clamp(s,-1,1);
  st.andando+=((Math.hypot(f,s)>0.05?1:0)-st.andando)*Math.min(1,dt*8);
  const sp=9*dt, sy=Math.sin(st.yaw), cy=Math.cos(st.yaw);
  let nx=st.x+(f*sy+s*cy)*sp, nz=st.z+(f*cy-s*sy)*sp;
  const m=HB+6; // a pirâmide não deixa passar
  if(Math.abs(nx)<m&&Math.abs(nz)<m){ if(m-Math.abs(nx)<m-Math.abs(nz)) nx=Math.sign(nx||1)*m; else nz=Math.sign(nz||1)*m; }
  st.x=clamp(nx,-700,700); st.z=clamp(nz,-700,700);
}

/* ---------- toque e mouse ---------- */
const joy={on:false,id:null,cx:0,cy:0}, look={id:null,x:0,y:0,x0:0,y0:0,t0:0};
cv.addEventListener('pointerdown',e=>{
  cv.setPointerCapture(e.pointerId);
  document.getElementById('dica').classList.add('sumiu');
  if(e.clientX<W*0.5){ joy.on=true; joy.id=e.pointerId; joy.cx=e.clientX; joy.cy=e.clientY; st.jx=0; st.jy=0; }
  else { look.id=e.pointerId; look.x=look.x0=e.clientX; look.y=look.y0=e.clientY; look.t0=performance.now(); }
});
cv.addEventListener('pointermove',e=>{
  if(joy.on&&e.pointerId===joy.id){ const dx=(e.clientX-joy.cx)/56, dy=(e.clientY-joy.cy)/56, l=Math.hypot(dx,dy)||1, m=Math.min(1,l); st.jx=dx/l*m; st.jy=-dy/l*m; }
  if(look.id===e.pointerId){ st.yaw+=(e.clientX-look.x)*0.006; st.pitch=clamp(st.pitch-(e.clientY-look.y)*0.004,-1.2,1.0); look.x=e.clientX; look.y=e.clientY; }
});
function acaba(e){
  if(joy.id===e.pointerId){ joy.on=false; joy.id=null; st.jx=0; st.jy=0; }
  if(look.id===e.pointerId){
    // toque rápido sem arrastar, com a estaca na mão: coloca onde a mira aponta
    const parado=Math.hypot(e.clientX-look.x0,e.clientY-look.y0)<10, rapido=performance.now()-look.t0<350;
    if(e.type==='pointerup'&&parado&&rapido&&st.hold) acao();
    look.id=null;
  }
}
cv.addEventListener('pointerup',acaba); cv.addEventListener('pointercancel',acaba);
addEventListener('keydown',e=>{
  st.keys[e.key.length===1?e.key.toLowerCase():e.key]=true;
  if(e.key.startsWith('Arrow')||e.key===' ') e.preventDefault();
  if(e.key===' '||e.key==='Enter') acao();
  if(e.key==='r'||e.key==='R') st.eye=st.eye>EYE?EYE:80;
});
addEventListener('keyup',e=>{ st.keys[e.key.length===1?e.key.toLowerCase():e.key]=false; });

/* ---------- botões ---------- */
document.getElementById('r-hora').addEventListener('input',e=>{ st.v=+e.target.value; });
document.getElementById('b-acao').addEventListener('click',acao);
document.getElementById('b-olhar').addEventListener('click',()=>{ st.eye=st.eye>EYE?EYE:80; });

/* ---------- laço principal ---------- */
let last=performance.now();
function frame(t){
  const dt=Math.min(0.05,(t-last)/1000); last=t;
  update(dt); andaAnim(t); draw(t); hud();
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
setTimeout(()=>document.getElementById('dica').classList.add('sumiu'),6000);

// para testes automáticos
window.__mnt3d={ st, get CAM(){ return CAM; }, alvo:()=>alvo(), atrasDaPiramide };
})();
</script>
