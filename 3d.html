<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#2A1C10">
<title>Mathematica: protótipo 3D, Tales em Gizé</title>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;700&family=EB+Garamond:ital,wght@0,400;0,500;0,700;1,400&display=swap" rel="stylesheet">
<style>
:root{--papiro:#E9D8AE;--papiro3:#D4B271;--tinta:#2A1C10;--tinta2:#4A3420;--verm:#9E3B26;--sombra:#6B4A26;--perg:#EFE3C4;--mar:#5E7F99}
*{box-sizing:border-box}
html,body{margin:0;height:100%;overflow:hidden;background:var(--papiro);touch-action:none;-webkit-user-select:none;user-select:none;font-family:"EB Garamond",Georgia,serif;color:var(--tinta)}
canvas{position:fixed;inset:0;width:100vw;height:100vh;display:block}
.ui{position:fixed;pointer-events:none}
.pilula{pointer-events:auto;background:rgba(233,216,174,.9);border:1.5px solid var(--tinta);border-radius:24px}
/* canto de cima à esquerda: voltar e o sol */
.canto{top:max(8px,env(safe-area-inset-top,0px));left:max(8px,env(safe-area-inset-left,0px));display:flex;align-items:center;gap:8px}
.btn-ico{pointer-events:auto;width:42px;height:42px;border-radius:50%;border:1.5px solid var(--tinta);background:rgba(233,216,174,.9);color:var(--tinta);display:flex;align-items:center;justify-content:center;text-decoration:none;font-size:26px;line-height:1;padding-bottom:3px}
.sol{display:flex;align-items:center;gap:6px;padding:2px 12px 2px 4px;height:46px}
.sol svg{width:42px;height:42px;flex:none}
.sol input{width:118px;accent-color:var(--verm);margin:0;height:28px}
.sol b{font-family:"Cinzel",Georgia,serif;font-weight:700;color:var(--verm);font-size:14px;min-width:3.2em;text-align:right}
/* canto de cima à direita: altura do olhar */
.olhar{top:max(8px,env(safe-area-inset-top,0px));right:max(8px,env(safe-area-inset-right,0px));display:flex;gap:8px}
button.forte{background:var(--tinta);color:var(--papiro)}
.painel-r{position:fixed;inset:0;z-index:5;background:rgba(20,12,6,.45);display:flex;align-items:center;justify-content:center;padding:12px;touch-action:auto}
.painel-r[hidden]{display:none}
.caixa-r{background:var(--perg);border:2px solid var(--tinta);border-radius:10px;width:min(560px,100%);max-height:100%;overflow:auto;padding:12px 16px}
.caixa-r h2{font-family:"Cinzel",Georgia,serif;font-size:17px;margin:0 0 4px}
.sub-r{margin:0 0 4px;font-size:14px;color:var(--tinta2)}
.lista-r{list-style:none;margin:0 0 6px;padding:0;font-size:15px}
.lista-r li{display:flex;flex-wrap:wrap;align-items:baseline;gap:2px 8px;padding:4px 0;border-bottom:1px solid rgba(74,52,32,.25)}
.lista-r li b{color:var(--verm);font-weight:700}
.lista-r li small{flex-basis:100%;font-size:13px;color:var(--tinta2);font-style:italic}
.lista-r li .hr{margin-left:auto;font-size:13px;color:var(--tinta2)}
.lista-r li.velha{opacity:.55}
.lista-r li.vazio{font-style:italic;color:var(--tinta2)}
.nota-r{margin:0 0 6px;font-size:12.5px;color:var(--tinta2)}
.linha-r{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.linha-r input{flex:1 1 140px;min-width:120px;height:42px;font:inherit;font-size:18px;padding:0 10px;border:1.5px solid var(--tinta);border-radius:6px;background:#FBF4E2;color:var(--tinta)}
.volta{margin:8px 0 0;min-height:1.3em;font-style:italic;color:var(--verm);font-size:15px;line-height:1.35}
.volta.certo{font-style:normal;color:var(--tinta)}
.volta b{color:var(--verm)}
button{pointer-events:auto;height:42px;padding:0 14px;border:1.5px solid var(--tinta);border-radius:22px;background:rgba(233,216,174,.9);color:var(--tinta);font-family:"Cinzel",Georgia,serif;font-size:13px;letter-spacing:.03em;white-space:nowrap;display:inline-flex;align-items:center;gap:6px}
button svg{width:16px;height:16px;flex:none}
/* embaixo, no meio: a barra de itens (como no Minecraft) */
.itens{bottom:max(10px,env(safe-area-inset-bottom,0px));left:50%;transform:translateX(-50%);display:flex;gap:8px;padding:5px;background:rgba(42,28,16,.55);border-radius:12px;pointer-events:auto}
.slot{width:62px;height:58px;padding:4px 0 2px;border-radius:8px;border:2px solid rgba(233,216,174,.7);background:rgba(233,216,174,.9);flex-direction:column;justify-content:center;gap:1px;font-size:10.5px;letter-spacing:.04em}
.slot svg{width:24px;height:24px}
.slot[aria-pressed="true"]{border-color:var(--verm);box-shadow:0 0 0 2px var(--verm);background:var(--perg)}
.dica{left:0;right:0;top:24%;text-align:center;font-style:italic;font-size:15px;color:var(--tinta);text-shadow:0 0 6px var(--papiro),0 0 2px var(--papiro),0 0 2px var(--papiro);transition:opacity 1.2s}
.dica.sumiu{opacity:0}
</style>
</head>
<body>
<canvas id="c"></canvas>

<div class="ui canto">
  <a class="btn-ico" id="b-volta" href="index.html#estudos" aria-label="Voltar aos estudos">&lsaquo;</a>
  <div class="pilula sol">
    <svg viewBox="0 0 60 60" aria-hidden="true">
      <circle cx="30" cy="31" r="22" fill="none" stroke="#2A1C10" stroke-width="1.2" stroke-dasharray="2 3" opacity=".7"/>
      <path d="M44 11 A22 22 0 0 1 51 22" fill="none" stroke="#9E3B26" stroke-width="1.6"/>
      <path d="M48.5 21 L51.6 23.4 L52.6 19.6" fill="none" stroke="#9E3B26" stroke-width="1.6" stroke-linejoin="round"/>
      <circle cx="30" cy="31" r="9" fill="#5E7F99" stroke="#2A1C10" stroke-width="1.4"/>
      <path d="M24 28 q3 -4 7 -2 q2 3 6 1" fill="none" stroke="#D4B271" stroke-width="2.2" stroke-linecap="round"/>
      <line x1="30" y1="22" x2="30" y2="17" stroke="#2A1C10" stroke-width="1.6" stroke-linecap="round"/>
      <g id="sol-ico"><circle r="5" fill="#9E3B26"/><g stroke="#9E3B26" stroke-width="1.3" stroke-linecap="round"><line x1="0" y1="-7.5" x2="0" y2="-9.5"/><line x1="0" y1="7.5" x2="0" y2="9.5"/><line x1="-7.5" y1="0" x2="-9.5" y2="0"/><line x1="7.5" y1="0" x2="9.5" y2="0"/></g></g>
    </svg>
    <input id="r-hora" type="range" min="0" max="240" step="30" value="30" aria-label="Hora do dia: mexe o sol">
    <b id="t-hora">13:30</b>
  </div>
</div>

<div class="ui olhar">
  <button type="button" id="b-responder" class="forte">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M4 5 h7 a2 2 0 0 1 2 2 v12 a2 2 0 0 0 -2 -2 h-7 Z M20 5 h-5 a2 2 0 0 0 -2 2"/><path d="M20 5 v12 h-5"/></svg>Responder
  </button>
  <button type="button" id="b-olhar" aria-label="Alternar altura do olhar">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M2 12 C5 6 19 6 22 12 C19 18 5 18 2 12 Z"/><circle cx="12" cy="12" r="3"/></svg><span id="t-olhar">Olhar de cima</span>
  </button>
</div>

<div class="ui itens" role="toolbar" aria-label="Itens">
  <button type="button" class="slot" id="slot-estaca" aria-pressed="false" aria-label="Estaca">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><line x1="14" y1="3" x2="10" y2="20"/><line x1="6" y1="21" x2="15" y2="21"/></svg><span>Estaca</span>
  </button>
  <button type="button" class="slot" id="slot-corda" aria-pressed="false" aria-label="Corda de medir">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><ellipse cx="12" cy="11" rx="6" ry="7"/><ellipse cx="12" cy="11" rx="3" ry="4"/><path d="M17 16 C19 19 21 19 22 21"/><circle cx="6.5" cy="9" r="1" fill="currentColor"/><circle cx="17.5" cy="9" r="1" fill="currentColor"/></svg><span>Corda</span>
  </button>
</div>

<div class="painel-r" id="r-painel" hidden role="dialog" aria-modal="true" aria-labelledby="r-tit">
  <div class="caixa-r">
    <h2 id="r-tit">Qual é a altura da pirâmide?</h2>
    <p class="sub-r">Suas medidas (só as que você fez):</p>
    <ul class="lista-r" id="r-lista"></ul>
    <p class="nota-r" id="r-nota" hidden>✗ = medida de outra hora. Agora são as <span id="r-agora"></span>.</p>
    <div class="linha-r">
      <input id="r-num" type="text" inputmode="decimal" autocomplete="off" placeholder="altura em passos" aria-label="Altura da pirâmide, em passos">
      <button type="button" class="forte" id="r-conferir">Conferir</button>
      <button type="button" id="r-fechar">Voltar a medir</button>
    </div>
    <p class="volta" id="r-volta" aria-live="polite"></p>
  </div>
</div>

<div class="ui dica" id="dica">Arraste à esquerda para andar · à direita para olhar · escolha um item embaixo</div>

<script>
(function(){
'use strict';
const cv=document.getElementById('c'), ctx=cv.getContext('2d');
let W=0,H=0,DPR=1,FP=1,K=1;
function resize(){ DPR=Math.min(2,window.devicePixelRatio||1); W=innerWidth; H=innerHeight; cv.width=Math.round(W*DPR); cv.height=Math.round(H*DPR); ctx.setTransform(DPR,0,0,DPR,0,0); FP=(H/2)/Math.tan(34*Math.PI/180); K=Math.min(W,H)/390; }
addEventListener('resize',resize); resize();

/* ---------- mundo (1 unidade = 1 passo = 1 metro) ---------- */
const ALT=146, HB=115, NEAR=0.25, EST_H=2, EYE=1.7, ALCANCE=30;
const rad=d=>d*Math.PI/180, clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
const dot=(a,b)=>a[0]*b[0]+a[1]*b[1]+a[2]*b[2];
const cross=(a,b)=>[a[1]*b[2]-a[2]*b[1],a[2]*b[0]-a[0]*b[2],a[0]*b[1]-a[1]*b[0]];
const norm=a=>{ const l=Math.hypot(a[0],a[1],a[2])||1; return [a[0]/l,a[1]/l,a[2]/l]; };
const add=(a,b)=>[a[0]+b[0],a[1]+b[1],a[2]+b[2]], sub=(a,b)=>[a[0]-b[0],a[1]-b[1],a[2]-b[2]], mul=(a,k)=>[a[0]*k,a[1]*k,a[2]*k];
const n2=v=>v.toFixed(2).replace('.',',');

// mesma conta do capítulo 1: 73,92 × sen(π × (hora − 6) / 12)
function elev(v){ const h=13+v/60; return rad(73.92*Math.sin(Math.PI*(h-6)/12)); }
// direção do sol, do chão até ele. Sul = −z, norte = +z, oeste = −x.
// À tarde o sol anda para o oeste: às 15:30 fica bem ao sul (a sombra aponta reto para o norte,
// como no capítulo 1); antes está a sudeste, depois a sudoeste.
function azim(v){ const h=13+v/60; return rad((h-15.5)*15); }
function sunDir(v){ const e=elev(v), A=azim(v); return [-Math.sin(A)*Math.cos(e),Math.sin(e),-Math.cos(A)*Math.cos(e)]; }
function horaTxt(v){ const m=780+v; return String(Math.floor(m/60)).padStart(2,'0')+':'+String(m%60).padStart(2,'0'); }

// começa a leste da pirâmide, olhando para o oeste: a sombra aparece de perfil
const st={ x:190, z:40, yaw:-Math.PI/2, pitch:-0.32, eye:EYE, v:30, yh:0, fase:0, medidas:[], stick:null, hold:null, anim:null, corda:null, cordaFase:0, jx:0, jy:0, keys:{}, andando:0 };

/* ---------- câmera e projeção ---------- */
let CAM=null;
function makeCam(){
  const cy=Math.cos(st.yaw), sy=Math.sin(st.yaw), cp=Math.cos(st.pitch), sp=Math.sin(st.pitch);
  const F=[sy*cp,sp,cy*cp], R=[cy,0,-sy], U=cross(F,R);
  // balanço de quem anda: sobe e desce a cada passo e vai um pouco de um lado para o outro
  const k=st.eye>EYE?0.2:1, bobY=Math.abs(Math.sin(st.fase))*0.11*st.andando*k, bobX=Math.sin(st.fase)*0.05*st.andando*k;
  return {F,R,U,E:[st.x+R[0]*bobX,st.yh+st.eye+bobY-0.05*st.andando*k,st.z+R[2]*bobX]};
}
function toView(p){ const d=sub(p,CAM.E); return [dot(d,CAM.R),dot(d,CAM.U),dot(d,CAM.F)]; }
function scr(v){ return [W/2+FP*v[0]/v[2], H/2-FP*v[1]/v[2]]; }
function clipPoly(vs){
  const out=[];
  for(let i=0;i<vs.length;i++){
    const a=vs[i], b=vs[(i+1)%vs.length], ai=a[2]>=NEAR, bi=b[2]>=NEAR;
    if(ai) out.push(a);
    if(ai!==bi){ const t=(NEAR-a[2])/(b[2]-a[2]); out.push([a[0]+(b[0]-a[0])*t,a[1]+(b[1]-a[1])*t,NEAR]); }
  }
  return out;
}
function poly3(pts,fill,stroke,lw){
  const vs=clipPoly(pts.map(toView)); if(vs.length<3) return;
  ctx.beginPath(); vs.forEach((v,i)=>{ const s=scr(v); i?ctx.lineTo(s[0],s[1]):ctx.moveTo(s[0],s[1]); }); ctx.closePath();
  if(fill){ ctx.fillStyle=fill; ctx.fill(); }
  if(stroke){ ctx.strokeStyle=stroke; ctx.lineWidth=lw||1; ctx.stroke(); }
}
function seg3(a,b,color,lw){
  let A=toView(a), B=toView(b);
  if(A[2]<NEAR&&B[2]<NEAR) return;
  if(A[2]<NEAR){ const t=(NEAR-A[2])/(B[2]-A[2]); A=[A[0]+(B[0]-A[0])*t,A[1]+(B[1]-A[1])*t,NEAR]; }
  if(B[2]<NEAR){ const t=(NEAR-B[2])/(A[2]-B[2]); B=[B[0]+(A[0]-B[0])*t,B[1]+(A[1]-B[1])*t,NEAR]; }
  const p=scr(A), q=scr(B);
  ctx.beginPath(); ctx.moveTo(p[0],p[1]); ctx.lineTo(q[0],q[1]); ctx.strokeStyle=color; ctx.lineWidth=lw; ctx.lineCap='round'; ctx.stroke();
}
function hull(pts){ // casco convexo no plano do chão (x, z)
  const p=pts.map(q=>[q[0],q[2]]).sort((a,b)=>a[0]-b[0]||a[1]-b[1]);
  const cr=(o,a,b)=>(a[0]-o[0])*(b[1]-o[1])-(a[1]-o[1])*(b[0]-o[0]);
  const lo=[], up=[];
  for(const q of p){ while(lo.length>1&&cr(lo[lo.length-2],lo[lo.length-1],q)<=0) lo.pop(); lo.push(q); }
  for(let i=p.length-1;i>=0;i--){ const q=p[i]; while(up.length>1&&cr(up[up.length-2],up[up.length-1],q)<=0) up.pop(); up.push(q); }
  up.pop(); lo.pop(); return lo.concat(up).map(q=>[q[0],0,q[1]]);
}
function shadowOnGround(p,S){ const k=p[1]/S[1]; return [p[0]-S[0]*k,0,p[2]-S[2]*k]; }

/* ---------- pirâmide ---------- */
const PA=[[-HB,0,-HB],[HB,0,-HB],[HB,0,HB],[-HB,0,HB]], PT=[0,ALT,0];
const FACES=[[PA[0],PA[1],PT],[PA[1],PA[2],PT],[PA[2],PA[3],PT],[PA[3],PA[0],PT]].map(f=>{
  const c=mul(add(add(f[0],f[1]),f[2]),1/3);
  let n=norm(cross(sub(f[1],f[0]),sub(f[2],f[0])));
  if(dot(n,sub(c,[0,ALT*0.3,0]))<0) n=mul(n,-1);
  return {f,c,n,d:dot(n,f[0])};
});
const PLANOS=FACES.map(q=>({n:q.n,d:q.d})).concat([{n:[0,-1,0],d:0}]);
// altura do chão em cada ponto: em cima da pirâmide, a altura da parede
function naPirAntes(){ return alturaChao(st.x,st.z)>0.5; }
function alturaChao(x,z){ const m=Math.max(Math.abs(x),Math.abs(z)); return m<HB?ALT*(1-m/HB):0; }
// a linha do olho bate na pirâmide? devolve a distância até a parede (ou null)
function raioPiramide(E,F){
  let t0=0, t1=Infinity;
  for(const p of PLANOS){
    const a=dot(p.n,E)-p.d, b=dot(p.n,F);
    if(Math.abs(b)<1e-9){ if(a>0) return null; continue; }
    const t=-a/b;
    if(b<0) t0=Math.max(t0,t); else t1=Math.min(t1,t);
    if(t0>t1) return null;
  }
  return t0>0?t0:null;
}
// a linha de A até B passa por dentro da pirâmide? (serve para saber o que está na frente)
function atrasDaPiramide(A,B){
  let t0=0, t1=1; const D=sub(B,A);
  for(const p of PLANOS){
    const a=dot(p.n,A)-p.d, b=dot(p.n,D);
    if(Math.abs(b)<1e-9){ if(a>0) return false; continue; }
    const t=-a/b;
    if(b<0) t0=Math.max(t0,t); else t1=Math.min(t1,t);
    if(t0>t1) return false;
  }
  return t1-t0>1e-3;
}
const C_LUZ=[0xD4,0xB2,0x71], C_SOMB=[0x6B,0x4A,0x26];
const FIADA=7.3, BLOCO=9; // altura de cada fiada de pedra e largura de cada bloco, em passos
function corPedra(lit,seed){
  const v=0.2+0.8*lit, r=Math.sin(seed*12.9898+4.1)*43758.5453, j=r-Math.floor(r), f=0.9+0.16*j;
  return 'rgb('+C_SOMB.map((c,i)=>Math.round(clamp((c+(C_LUZ[i]-c)*v)*f,0,255))).join(',')+')';
}
function desenhaFace(q){
  const [B0,B1,T]=q.f, n=Math.ceil(ALT/FIADA);
  const P=(B,y)=>add(B,mul(sub(T,B),y/ALT));
  for(let i=0;i<n;i++){ const y0=i*FIADA, y1=Math.min(ALT,(i+1)*FIADA); poly3([P(B0,y0),P(B1,y0),P(B1,y1),P(B0,y1)],corPedra(q.lit,q.fi*97+i)); }
  if(q.dist<900){
    const a=clamp(1-q.dist/900,0.15,0.6);
    const cf='rgba(42,28,16,'+(a*0.9).toFixed(2)+')', cj='rgba(42,28,16,'+(a*0.6).toFixed(2)+')';
    for(let i=1;i<n;i++) seg3(P(B0,i*FIADA),P(B1,i*FIADA),cf,1);
    if(q.dist<520) for(let i=0;i<n;i++){
      const y0=i*FIADA, y1=Math.min(ALT,(i+1)*FIADA), L0=P(B0,y0), R0=P(B1,y0), L1=P(B0,y1), R1=P(B1,y1);
      const larg=Math.hypot(...sub(R0,L0)), nb=larg/BLOCO, des=(i%2)*0.5;
      for(let k=1;k<nb;k++){ const t=(k-des)/nb; if(t<=0||t>=1) continue; seg3(add(L0,mul(sub(R0,L0),t)),add(L1,mul(sub(R1,L1),t)),cj,1); }
    }
  }
  poly3(q.f,null,'#2A1C10',1.2);
}
function mixCor(t){ return 'rgb('+C_SOMB.map((c,i)=>Math.round(c+(C_LUZ[i]-c)*t)).join(',')+')'; }

/* ---------- onde a mira aponta no chão ---------- */
// pontos onde a corda "gruda", para medir com o dedo sem precisar de precisão
function pontosImportantes(){
  const S=sunDir(st.v), e=elev(st.v), L=ALT/Math.tan(e), A=azim(st.v), d=[Math.sin(A),0,Math.cos(A)];
  const r=HB/Math.max(Math.abs(d[0]),Math.abs(d[2]));
  const lista=[];
  if(L>r+0.5){ lista.push({p:mul(d,L),nome:'ponta da sombra da pirâmide'}); lista.push({p:mul(d,r),nome:'onde a sombra sai da pirâmide'}); }
  if(st.stick){ const b=[st.stick.x,0,st.stick.z]; lista.push({p:b,nome:'pé da estaca'}); lista.push({p:shadowOnGround([st.stick.x,EST_H,st.stick.z],S),nome:'ponta da sombra da estaca'}); }
  for(const c of PA) lista.push({p:c,nome:'canto da base'});
  for(const m of [[0,0,-HB],[HB,0,0],[0,0,HB],[-HB,0,0]]) lista.push({p:m,nome:'meio da beira'});
  lista.push({p:PT,nome:'topo da pirâmide',raio:10});
  return lista;
}
function gruda(p){
  let melhor=null, dm=Infinity;
  for(const q of pontosImportantes()){ const dd=Math.hypot(q.p[0]-p[0],q.p[1]-p[1],q.p[2]-p[2]); if(dd<(q.raio||3)&&dd<dm){ dm=dd; melhor=q; } }
  return melhor;
}
function alvo(tipo){
  const F=CAM.F, E=CAM.E, pe=[st.x,st.yh,st.z];
  const tP=raioPiramide(E,F), tG=F[1]<-0.01?-E[1]/F[1]:Infinity;
  const lim=tipo==='corda'?60:ALCANCE;
  if(tP!==null&&tP<tG){ // a mira está na parede da pirâmide
    const p=add(E,mul(F,tP));
    if(tipo!=='corda') return {ok:false,motivo:'aqui é a pirâmide',p};
    if(Math.hypot(...sub(p,pe))>lim) return {ok:false,motivo:'chegue mais perto',p};
    const g=gruda(p); return {ok:true,p:g?g.p.slice():p,nome:g?g.nome:'na parede da pirâmide'};
  }
  if(tG===Infinity) return {ok:false,motivo:tipo==='corda'?'mire no chão ou na pirâmide':'olhe para o chão'};
  const p=add(E,mul(F,tG)); p[1]=0;
  if(Math.hypot(p[0]-st.x,p[2]-st.z)>lim) return {ok:false,motivo:'chegue mais perto',p};
  if(tipo==='corda'){ const g=gruda(p); return {ok:true,p:g?g.p.slice():p,nome:g?g.nome:null}; }
  if(Math.abs(p[0])<HB+1&&Math.abs(p[2])<HB+1) return {ok:false,motivo:'aqui é a pirâmide',p};
  return {ok:true,p};
}

/* ---------- textos na cena ---------- */
function rotuloLivre(p,txt,cor,tam,dy){
  const v=toView(p); if(v[2]<NEAR) return; const s=scr(v); s[1]+=dy||0;
  ctx.font='700 '+(tam||16)+'px "EB Garamond",Georgia,serif'; ctx.textAlign='center'; ctx.textBaseline='middle';
  ctx.lineWidth=4; ctx.strokeStyle='rgba(239,227,196,.95)'; ctx.lineJoin='round'; ctx.strokeText(txt,s[0],s[1]);
  ctx.fillStyle=cor||'#2A1C10'; ctx.fillText(txt,s[0],s[1]); ctx.textAlign='start'; ctx.textBaseline='alphabetic';
}
function rotulo(p,txt,cor,tam,dy){
  const v=toView(p); if(v[2]<NEAR) return false;
  if(atrasDaPiramide(CAM.E,p)) return false;
  const sv=scr(v); if(sv[0]<-40||sv[0]>W+40||sv[1]<-20||sv[1]>H+20) return false;
  const s=scr(v); s[1]+=dy||0;
  ctx.font='700 '+(tam||16)+'px "EB Garamond",Georgia,serif'; ctx.textAlign='center'; ctx.textBaseline='middle';
  ctx.lineWidth=4; ctx.strokeStyle='rgba(239,227,196,.95)'; ctx.lineJoin='round'; ctx.strokeText(txt,s[0],s[1]);
  ctx.fillStyle=cor||'#2A1C10'; ctx.fillText(txt,s[0],s[1]);
  ctx.textAlign='start'; ctx.textBaseline='alphabetic';
  return true;
}

/* ---------- desenho ---------- */
function desenhaEstaca(b,alfa){
  const t=[b[0],EST_H,b[2]];
  ctx.globalAlpha=alfa; seg3(b,t,'#2A1C10',6); seg3(add(b,[0,0.05,0]),add(t,[0,-0.05,0]),'#8A5E2E',3.5); ctx.globalAlpha=1;
}
function draw(t){
  const S=sunDir(st.v), e=elev(st.v), tg=Math.tan(e);
  CAM=makeCam();
  const g=ctx.createLinearGradient(0,0,0,H); g.addColorStop(0,'#D9C48F'); g.addColorStop(0.6,'#EFE3C4'); g.addColorStop(1,'#E2CC98');
  ctx.fillStyle=g; ctx.fillRect(0,0,W,H);
  // sol
  { const sp=add(CAM.E,mul(S,900)), v=toView(sp); if(v[2]>NEAR){ const p=scr(v); const gl=ctx.createRadialGradient(p[0],p[1],6,p[0],p[1],90); gl.addColorStop(0,'rgba(158,59,38,.35)'); gl.addColorStop(1,'rgba(158,59,38,0)'); ctx.fillStyle=gl; ctx.fillRect(p[0]-90,p[1]-90,180,180); ctx.beginPath(); ctx.arc(p[0],p[1],16,0,Math.PI*2); ctx.fillStyle='#9E3B26'; ctx.fill(); } }
  // chão
  poly3([[-900,0,-900],[900,0,-900],[900,0,900],[-900,0,900]],'#E2CC98');
  for(let i=-400;i<=400;i+=20){ seg3([i,0,-400],[i,0,400],'rgba(42,28,16,.16)',1); seg3([-400,0,i],[400,0,i],'rgba(42,28,16,.16)',1); }
  // sombras no chão
  poly3(hull([...PA,shadowOnGround(PT,S)]),'rgba(42,28,16,.38)');
  let sombEst=null;
  if(st.stick){ const b=[st.stick.x,0,st.stick.z]; sombEst=shadowOnGround([st.stick.x,EST_H,st.stick.z],S); seg3(b,sombEst,'rgba(42,28,16,.6)',5); }
  // a corda esticada no chão
  const mira=st.hold&&!(st.anim&&st.anim.tipo!=='usar')?alvo(st.hold):null;
  let cordaFim=null;
  if(st.corda) cordaFim=st.corda.b||(st.cordaFase===1&&mira&&mira.ok&&st.hold==='corda'?mira.p:null);
  const cordaEscondida=st.corda&&atrasDaPiramide(CAM.E,ergue(st.corda.a))&&(!cordaFim||atrasDaPiramide(CAM.E,ergue(cordaFim)));
  const pintaCorda=()=>{ if(!st.corda) return; if(cordaFim) desenhaCorda(st.corda.a,cordaFim); else marcaPonto(st.corda.a); };
  if(cordaEscondida) pintaCorda();
  // marca onde a estaca vai ficar
  if(mira&&mira.ok&&st.hold==='estaca'){
    const c=mira.p, pts=[]; for(let i=0;i<20;i++){ const a=i/20*Math.PI*2; pts.push([c[0]+Math.cos(a)*0.6,0,c[2]+Math.sin(a)*0.6]); }
    poly3(pts,'rgba(158,59,38,.25)','#9E3B26',2);
    desenhaEstaca(c,0.35);
  }
  // estaca e pirâmide: o que está mais longe vai primeiro
  const estacaAtras=st.stick&&atrasDaPiramide(CAM.E,[st.stick.x,1,st.stick.z]);
  if(st.stick&&estacaAtras) desenhaEstaca([st.stick.x,0,st.stick.z],1);
  const fs=[];
  FACES.forEach((q,fi)=>{
    if(dot(q.n,sub(CAM.E,q.c))<=0) return;
    fs.push({f:q.f,fi,dist:Math.hypot(...sub(CAM.E,q.c)),lit:Math.max(0,dot(q.n,S))});
  });
  fs.sort((a,b)=>b.dist-a.dist);
  for(const q of fs) desenhaFace(q);
  if(!cordaEscondida) pintaCorda();
  if(mira&&mira.ok&&st.hold==='corda') marcaPonto(mira.p);
  if(st.stick&&!estacaAtras) desenhaEstaca([st.stick.x,0,st.stick.z],1);
  // números em cima das coisas
  if(st.stick&&Math.hypot(st.stick.x-CAM.E[0],1-CAM.E[1],st.stick.z-CAM.E[2])<60){
    rotulo([st.stick.x,EST_H+0.45,st.stick.z],'2 passos','#2A1C10',16);
    const meio=mul(add([st.stick.x,0,st.stick.z],sombEst),0.5);
    // só conta como medida o que ele viu na tela
    if(rotulo(meio,'sombra '+n2(EST_H/tg),'#9E3B26',16,20)) anota({tipo:'estaca',sombra:EST_H/tg,v:st.v});
  }
  if(st.corda&&cordaFim){ const L=Math.hypot(...sub(cordaFim,st.corda.a)); if(L>0.05) rotuloLivre(ergue(mul(add(st.corda.a,cordaFim),0.5)),'corda '+L.toFixed(1).replace('.',',')+' passos','#2A1C10',17,-18); }
  // joystick
  if(joy.on){ ctx.beginPath(); ctx.arc(joy.cx,joy.cy,56,0,Math.PI*2); ctx.strokeStyle='rgba(42,28,16,.5)'; ctx.lineWidth=2; ctx.stroke(); ctx.beginPath(); ctx.arc(joy.cx+st.jx*56,joy.cy+st.jy*-56,22,0,Math.PI*2); ctx.fillStyle='rgba(158,59,38,.6)'; ctx.fill(); }
  // mira no meio da tela
  desenhaMira(mira);
  // a mão
  desenhaMao(t);
}
// um pouco acima do chão ou da parede, para a corda não sumir dentro da pedra
function ergue(p){ return p[1]<0.01?[p[0],0.05,p[2]]:[p[0],p[1]+0.3,p[2]]; }
function marcaPonto(p){
  const v=toView(ergue(p)); if(v[2]<NEAR) return; const s=scr(v), r=Math.max(3,Math.min(9,0.5*FP/v[2]));
  ctx.beginPath(); ctx.arc(s[0],s[1],r,0,Math.PI*2); ctx.fillStyle='#9E3B26'; ctx.fill(); ctx.lineWidth=2; ctx.strokeStyle='rgba(239,227,196,.95)'; ctx.stroke();
}
// corda com um nó a cada passo, como a corda de nós do Egito
function desenhaCorda(a0,b0){
  const L=Math.hypot(...sub(b0,a0)); if(L<0.05){ marcaPonto(a0); return; }
  const a=ergue(a0), b=ergue(b0);
  seg3(a,b,'#5A3A1A',3);
  const passo=L>120?5:1;
  for(let k=passo;k<L;k+=passo){
    const t=k/L, v=toView([a[0]+(b[0]-a[0])*t,a[1]+(b[1]-a[1])*t,a[2]+(b[2]-a[2])*t]); if(v[2]<NEAR) continue;
    const s=scr(v), r=Math.max(1.2,Math.min(5,0.12*FP/v[2]));
    ctx.beginPath(); ctx.arc(s[0],s[1],r,0,Math.PI*2); ctx.fillStyle='#2A1C10'; ctx.fill();
  }
  marcaPonto(a0); marcaPonto(b0);
}
function desenhaMira(m){
  const x=W/2, y=H/2, r=9;
  const cor=m?(m.ok?'#9E3B26':'rgba(42,28,16,.45)'):'rgba(42,28,16,.55)';
  ctx.strokeStyle='rgba(239,227,196,.9)'; ctx.lineWidth=4; ctx.lineCap='round';
  ctx.beginPath(); ctx.moveTo(x-r,y); ctx.lineTo(x+r,y); ctx.moveTo(x,y-r); ctx.lineTo(x,y+r); ctx.stroke();
  ctx.strokeStyle=cor; ctx.lineWidth=2;
  ctx.beginPath(); ctx.moveTo(x-r,y); ctx.lineTo(x+r,y); ctx.moveTo(x,y-r); ctx.lineTo(x,y+r); ctx.stroke();
  let txt=null;
  if(m&&!m.ok) txt=m.motivo;
  else if(m&&st.hold==='estaca') txt='toque para colocar';
  else if(m&&st.hold==='corda') txt=(st.cordaFase===1?'toque para marcar o fim':'toque para marcar o começo')+(m.nome?' · '+m.nome:'');
  if(txt){
    ctx.font='italic 14px "EB Garamond",Georgia,serif'; ctx.textAlign='center';
    ctx.lineWidth=4; ctx.strokeStyle='rgba(239,227,196,.95)'; ctx.strokeText(txt,x,y+28); ctx.fillStyle='#2A1C10'; ctx.fillText(txt,x,y+28); ctx.textAlign='start';
  }
}
// mão em silhueta, como nos vasos gregos, segurando a estaca
function desenhaMao(t){
  let p=0, tipo=null;
  if(st.anim){ p=clamp((t-st.anim.t0)/st.anim.dur,0,1); tipo=st.anim.tipo; }
  const item=st.hold||(tipo==='colocar'&&p<0.5?'estaca':null), segura=!!item;
  if(!segura&&!tipo) return;
  const bob=Math.abs(Math.sin(st.fase))*7*K*st.andando;
  const bobX=Math.sin(st.fase)*5*K*st.andando;
  let bx=W-118*K+bobX, by=H-74*K+bob, ang=-0.18, esc=1;
  if(tipo==='colocar'){ const s=Math.sin(p*Math.PI); bx-=(W*0.22)*s; by+=40*K*s; ang-=0.5*s; esc=1-0.25*s; }
  if(tipo==='pegar'){ by+=(1-p)*220*K; }
  if(tipo==='usar'){ const s=Math.sin(p*Math.PI); bx-=(W*0.12)*s; by+=24*K*s; ang-=0.3*s; }
  ctx.save(); ctx.translate(bx,by); ctx.rotate(ang); ctx.scale(esc*K,esc*K);
  // braço
  ctx.fillStyle='#2A1C10';
  ctx.beginPath(); ctx.moveTo(-26,12); ctx.lineTo(26,10); ctx.lineTo(120,180); ctx.lineTo(30,200); ctx.closePath(); ctx.fill();
  // rolo de corda na mão
  if(item==='corda'){
    ctx.lineWidth=7;
    for(let i=0;i<4;i++){ ctx.strokeStyle=i%2?'#5A3A1A':'#7A5228'; ctx.beginPath(); ctx.ellipse(-14+i*3,-46+i*2,34-i*2,46-i*3,-0.35,0,Math.PI*2); ctx.stroke(); }
    ctx.fillStyle='#2A1C10'; for(let i=0;i<6;i++){ const a=i/6*Math.PI*2; ctx.beginPath(); ctx.arc(-14+Math.cos(a)*34,-46+Math.sin(a)*46,3.2,0,Math.PI*2); ctx.fill(); }
  }
  // estaca (atrás dos dedos)
  if(item==='estaca'){
    ctx.lineCap='round';
    ctx.strokeStyle='#2A1C10'; ctx.lineWidth=15; ctx.beginPath(); ctx.moveTo(-6,60); ctx.lineTo(-30,-170); ctx.stroke();
    ctx.strokeStyle='#8A5E2E'; ctx.lineWidth=9; ctx.beginPath(); ctx.moveTo(-6,58); ctx.lineTo(-30,-168); ctx.stroke();
    ctx.strokeStyle='rgba(239,227,196,.35)'; ctx.lineWidth=2.5; ctx.beginPath(); ctx.moveTo(-9,50); ctx.lineTo(-32,-160); ctx.stroke();
  }
  // punho e dedos
  ctx.fillStyle='#2A1C10';
  ctx.beginPath(); ctx.ellipse(0,4,30,24,-0.2,0,Math.PI*2); ctx.fill();
  for(let i=0;i<4;i++){ ctx.beginPath(); ctx.ellipse(-24+i*2,-14+i*11,10,7,0.2,0,Math.PI*2); ctx.fill(); }
  ctx.strokeStyle='rgba(212,178,113,.55)'; ctx.lineWidth=1.6;
  for(let i=1;i<4;i++){ ctx.beginPath(); ctx.moveTo(-30+i*2,-19+i*11); ctx.lineTo(-12+i*2,-17+i*11); ctx.stroke(); }
  ctx.restore();
}

/* ---------- textos do HUD ---------- */
function hud(){
  document.getElementById('t-hora').textContent=horaTxt(st.v);
  document.getElementById('slot-estaca').setAttribute('aria-pressed',String(st.hold==='estaca'));
  document.getElementById('slot-corda').setAttribute('aria-pressed',String(st.hold==='corda'));
  document.getElementById('t-olhar').textContent=st.eye>EYE?'Olhar de gente':'Olhar de cima';
  // o sol do desenho dá a volta na Terra conforme a hora (meio-dia em cima)
  const h=13+st.v/60, a=rad((h-12)*15), x=30+22*Math.sin(a), y=31-22*Math.cos(a);
  document.getElementById('sol-ico').setAttribute('transform','translate('+x.toFixed(1)+' '+y.toFixed(1)+')');
}

/* ---------- caderno de medidas ---------- */
function anota(m){
  const L=st.medidas;
  // só sombras mudam com a hora; a base e a parede, não
  m.hora=m.tipo==='estaca'||/sombra/.test((m.a||'')+' '+(m.b||''));
  if(m.tipo==='estaca'){ if(L.some(x=>x.tipo==='estaca'&&x.v===m.v)) return; }
  L.unshift(m); if(L.length>10) L.pop();
}
const nomePonto=n=>n||'um ponto no chão';
function textoMedida(m){
  if(m.tipo==='estaca') return '<b>Estaca</b> de 2 passos fazia <b>sombra '+n2(m.sombra)+'</b>';
  return '<b>Corda: '+m.L.toFixed(1).replace('.',',')+' passos</b><small>de '+nomePonto(m.a)+' até '+nomePonto(m.b)+'</small>';
}
function abreResposta(){
  const lista=document.getElementById('r-lista');
  lista.innerHTML=st.medidas.length?st.medidas.map(m=>{ const velha=m.hora&&m.v!==st.v; return '<li class="'+(velha?'velha':'')+'">'+textoMedida(m)+(m.hora?'<span class="hr">'+horaTxt(m.v)+(velha?' ✗':'')+'</span>':'')+'</li>'; }).join(''):
    '<li class="vazio">Você ainda não mediu nada. Plante a estaca e use a corda.</li>';
  document.getElementById('r-nota').hidden=!st.medidas.some(m=>m.hora&&m.v!==st.v);
  document.getElementById('r-volta').textContent=''; document.getElementById('r-painel').hidden=false;
  st.keys={}; st.jx=0; st.jy=0;
}
function fechaResposta(){ document.getElementById('r-painel').hidden=true; }
function confere(){
  const val=parseFloat(String(document.getElementById('r-num').value).replace(',','.')), out=document.getElementById('r-volta');
  if(!isFinite(val)){ out.textContent='Escreva um número, em passos.'; return; }
  if(Math.abs(val-ALT)<=4){ out.innerHTML='<b>Isso!</b> A pirâmide tem 146 passos de altura. Quando a sombra da estaca fica do tamanho da estaca, a sombra da pirâmide, contada desde o meio dela, também fica do tamanho dela: a parte que aparece mais a metade da base.'; out.className='volta certo'; return; }
  out.className='volta';
  const perto=x=>Math.abs(val-x)<=2;
  const c=st.medidas.find(m=>m.tipo==='corda'&&perto(m.L));
  if(c){ const nomes=(c.a||'')+' '+(c.b||'');
    if(/topo/.test(nomes)){ out.textContent='Essa corda subiu pela parede, inclinada. A altura é reta: do topo até o meio do chão, lá dentro da pedra.'; return; }
    if(/sombra/.test(nomes)){ out.textContent='Esse é só o pedaço da sombra que aparece. Falta o pedaço escondido embaixo da pirâmide.'; return; }
    if(/meio da beira/.test(nomes)&&/canto/.test(nomes)){ out.textContent='Essa é a metade da base: é o pedaço da sombra que fica escondido. Falta somar a parte que aparece.'; return; }
    if(perto(2*HB)){ out.textContent='Essa é a base inteira. A sombra escondida é só a metade dela.'; return; }
  }
  if(perto(HB)){ out.textContent='Essa é a metade da base, o pedaço escondido. Falta a parte da sombra que aparece.'; return; }
  out.textContent='Ainda não é isso. Compare a estaca com a sombra dela, e meça a pirâmide na mesma hora.';
}

/* ---------- pegar, colocar e usar a corda ---------- */
function acao(){
  if(st.anim||!st.hold) return;
  const t=performance.now(), m=alvo(st.hold); if(!m.ok) return;
  if(st.hold==='estaca'){ st.anim={tipo:'colocar',t0:t,dur:520,p:m.p,pos:false}; return; }
  // corda: primeiro toque marca o começo, o segundo marca o fim
  if(st.cordaFase===0){ st.corda={a:m.p,b:null,na:m.nome}; st.cordaFase=1; }
  else { st.corda.b=m.p; st.corda.nb=m.nome; st.cordaFase=0; anota({tipo:'corda',L:Math.hypot(...sub(st.corda.b,st.corda.a)),a:st.corda.na,b:m.nome,v:st.v}); }
  st.anim={tipo:'usar',t0:t,dur:260};
}
function escolhe(item){
  if(st.anim&&st.anim.tipo!=='usar') return;
  if(st.hold==='corda'&&st.cordaFase===1){ st.cordaFase=0; if(st.corda&&!st.corda.b) st.corda=null; }
  if(st.hold===item){ st.hold=null; return; } // tocar de novo guarda o item
  if(item==='estaca') st.stick=null; // a estaca volta para a mão
  st.hold=item; st.anim={tipo:'pegar',t0:performance.now(),dur:320};
}
function andaAnim(t){
  const a=st.anim; if(!a) return;
  const p=(t-a.t0)/a.dur;
  if(a.tipo==='colocar'&&p>=0.5&&!a.pos){ a.pos=true; st.hold=null; st.stick={x:a.p[0],z:a.p[2]}; }
  if(p>=1) st.anim=null;
}

/* ---------- movimento ---------- */
function update(dt){
  const k=st.keys;
  let f=(k.w||k.ArrowUp?1:0)-(k.s||k.ArrowDown?1:0)+st.jy;
  let s=(k.d?1:0)-(k.a?1:0)+st.jx;
  const yawKey=(k.ArrowRight||k.e?1:0)-(k.ArrowLeft||k.q?1:0);
  if(yawKey) st.yaw+=yawKey*dt*1.6;
  f=clamp(f,-1,1); s=clamp(s,-1,1);
  st.andando+=((Math.hypot(f,s)>0.05?1:0)-st.andando)*Math.min(1,dt*8);
  st.fase+=dt*(naPirAntes()?7:9.5)*st.andando; // passos: faz a câmera balançar um pouco
  // na pirâmide se anda mais devagar: é uma subida
  const naPir=alturaChao(st.x,st.z)>0.5, sp=(naPir?8:14)*dt, sy=Math.sin(st.yaw), cy=Math.cos(st.yaw);
  st.x=clamp(st.x+(f*sy+s*cy)*sp,-700,700); st.z=clamp(st.z+(f*cy-s*sy)*sp,-700,700);
  st.yh+=(alturaChao(st.x,st.z)-st.yh)*Math.min(1,dt*12);
}

/* ---------- toque e mouse ---------- */
const joy={on:false,id:null,cx:0,cy:0}, look={id:null,x:0,y:0,x0:0,y0:0,t0:0};
cv.addEventListener('pointerdown',e=>{
  try{ cv.setPointerCapture(e.pointerId); }catch(_){}
  document.getElementById('dica').classList.add('sumiu');
  if(e.clientX<W*0.5){ joy.on=true; joy.id=e.pointerId; joy.cx=e.clientX; joy.cy=e.clientY; st.jx=0; st.jy=0; }
  else { look.id=e.pointerId; look.x=look.x0=e.clientX; look.y=look.y0=e.clientY; look.t0=performance.now(); }
});
cv.addEventListener('pointermove',e=>{
  if(joy.on&&e.pointerId===joy.id){ const dx=(e.clientX-joy.cx)/56, dy=(e.clientY-joy.cy)/56, l=Math.hypot(dx,dy)||1, m=Math.min(1,l); st.jx=dx/l*m; st.jy=-dy/l*m; }
  if(look.id===e.pointerId){ st.yaw+=(e.clientX-look.x)*0.006; st.pitch=clamp(st.pitch-(e.clientY-look.y)*0.004,-1.2,1.0); look.x=e.clientX; look.y=e.clientY; }
});
function acaba(e){
  if(joy.id===e.pointerId){ joy.on=false; joy.id=null; st.jx=0; st.jy=0; }
  if(look.id===e.pointerId){
    // toque rápido sem arrastar, com a estaca na mão: coloca onde a mira aponta
    const parado=Math.hypot(e.clientX-look.x0,e.clientY-look.y0)<10, rapido=performance.now()-look.t0<350;
    if(e.type==='pointerup'&&parado&&rapido&&st.hold) acao();
    look.id=null;
  }
}
cv.addEventListener('pointerup',acaba); cv.addEventListener('pointercancel',acaba);
addEventListener('keydown',e=>{
  if(!document.getElementById('r-painel').hidden){ if(e.key==='Escape') fechaResposta(); return; }
  st.keys[e.key.length===1?e.key.toLowerCase():e.key]=true;
  if(e.key.startsWith('Arrow')||e.key===' ') e.preventDefault();
  if(e.key===' '||e.key==='Enter') acao();
  if(e.key==='1') escolhe('estaca');
  if(e.key==='2') escolhe('corda');
  if(e.key==='r'||e.key==='R') st.eye=st.eye>EYE?EYE:80;
});
addEventListener('keyup',e=>{ st.keys[e.key.length===1?e.key.toLowerCase():e.key]=false; });

/* ---------- botões ---------- */
document.getElementById('r-hora').addEventListener('input',e=>{ st.v=+e.target.value; });
// com um dedo no joystick, o celular não manda "clique" para o segundo dedo: o botão age ao encostar
function toque(id,fn){
  const el=document.getElementById(id); let ult=0;
  el.addEventListener('pointerdown',e=>{ e.preventDefault(); ult=performance.now(); fn(); });
  el.addEventListener('click',()=>{ if(performance.now()-ult>700) fn(); }); // teclado e leitores de tela
}
toque('slot-estaca',()=>escolhe('estaca'));
toque('slot-corda',()=>escolhe('corda'));
toque('b-olhar',()=>{ st.eye=st.eye>EYE?EYE:80; });
toque('b-responder',()=>{ document.getElementById('r-agora').textContent=horaTxt(st.v); abreResposta(); });
document.getElementById('r-fechar').addEventListener('click',fechaResposta);
document.getElementById('r-conferir').addEventListener('click',confere);
document.getElementById('r-num').addEventListener('keydown',e=>{ if(e.key==='Enter') confere(); e.stopPropagation(); });

/* ---------- laço principal ---------- */
let last=performance.now();
function frame(t){
  const dt=Math.min(0.05,(t-last)/1000); last=t;
  update(dt); andaAnim(t); draw(t); hud();
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
setTimeout(()=>document.getElementById('dica').classList.add('sumiu'),6000);

// para testes automáticos
window.__mnt3d={ abreResposta, confere, st, get CAM(){ return CAM; }, alvo:t=>alvo(t), atrasDaPiramide, acao, escolhe, sunDir, alturaChao };
})();
</script>
